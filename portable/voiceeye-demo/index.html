<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoiceEye 80초 회의 시연</title>
  <style>
    :root{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:#182227;background:#f4f5f0}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}.page{min-height:100vh;padding:24px}.head{display:flex;align-items:end;justify-content:space-between;gap:24px;max-width:1440px;margin:0 auto 16px;border-bottom:1px solid #cbd2ce;padding-bottom:14px}.brand{margin:0 0 5px;color:#0d7772;font-size:12px;font-weight:800;letter-spacing:.18em}.head h1{margin:0;font-size:clamp(25px,2.5vw,38px);letter-spacing:-.04em}.tag{border:1px solid #b9c3be;border-radius:999px;background:#fff;padding:8px 12px;color:#4b5a60;font-size:12px;font-weight:700}.shell{display:grid;grid-template-columns:minmax(0,1fr)270px;max-width:1440px;height:min(78vh,780px);min-height:590px;margin:auto;overflow:hidden;border:1px solid #c7cfca;border-radius:18px;background:#fff;box-shadow:0 20px 60px #1a2a2d18}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;padding:25px}.meta{display:flex;justify-content:space-between;border-bottom:1px solid #dde2df;padding-bottom:13px}.meta span,.time span{color:#718087;font-size:12px;font-weight:700}.meta strong{margin-left:11px;font-size:15px}.room{position:relative;display:grid;place-items:center;min-height:0;padding:82px 20px 64px}.room:before{position:absolute;inset:14% 7% 12%;border:1px solid #dfe5e1;border-radius:48%;background:linear-gradient(#f8faf7,#edf2ee);content:""}.seat,.self{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;color:#6f7a7f}.seat>i,.self>i{display:grid;width:40px;height:40px;place-items:center;border:1px solid #ccd5d0;border-radius:50%;background:#fff;font-style:normal;font-weight:800;box-shadow:0 7px 18px #1e2f3015}.seat b,.seat small,.self small{display:block;font-size:12px}.seat small,.self small{font-size:10px}.seat.on,.self.on{color:#075d59}.seat.on>i,.self.on>i{border-color:#0d7772;background:#dff3ef;box-shadow:0 0 0 6px #0d77721f}.left{left:3%;top:18%}.center{left:50%;top:5%;transform:translateX(-50%)}.right{right:3%;top:18%}.self{bottom:2%;left:50%;transform:translateX(-50%)}.caption{position:relative;z-index:4;width:min(90%,900px);min-height:275px;border:1px solid #c7d3cd;border-top:5px solid #0d7772;border-radius:15px;background:#fffffff7;box-shadow:0 16px 45px #1f313321;padding:28px}.ready{display:flex;min-height:210px;flex-direction:column;justify-content:center;text-align:center}.ready span,.caphead span{color:#0d7772;font-size:12px;font-weight:800;letter-spacing:.08em}.ready h2,.caption h2{margin:9px 0 0;font-size:clamp(20px,2vw,29px);letter-spacing:-.03em}.ready p{max-width:610px;margin:12px auto 0;color:#627077;line-height:1.6}.caphead{display:flex;justify-content:space-between}.status{border-radius:999px;background:#e1f2ec;padding:5px 9px;color:#0a6659;font-size:11px;font-weight:800}.status.warn{background:#fff0d5;color:#905600}.lines{display:grid;gap:11px;margin-top:18px}.line{border-left:4px solid #0d7772;padding-left:14px}.line.leftline{border-color:#3769b0}.line.rightline{border-color:#a05e25}.line.selfline{border-color:#6c4ca0}.line.systemline{border-color:#b06a00}.line span{color:#59686e;font-size:12px;font-weight:700}.line p{margin:4px 0 0;font-size:clamp(17px,1.5vw,22px);font-weight:600;line-height:1.45}.note{position:absolute;right:24px;bottom:15px;left:24px;margin:0;border-top:1px solid #e1e6e3;padding-top:11px;color:#6c7a80;font-size:12px}.compose{display:flex;min-height:75px;align-items:center;justify-content:space-between;gap:16px;border:1px solid #d2d9d5;border-radius:12px;background:#f8faf8;padding:14px 16px;opacity:.45}.compose.on{border-color:#7ca9a2;background:#f0f8f5;opacity:1}.compose span{color:#607077;font-size:11px;font-weight:700}.compose p{margin:4px 0 0;font-size:14px;font-weight:700}.compose b{border-radius:999px;background:#dce9e5;padding:7px 10px;color:#33524f;font-size:11px}.side{display:grid;grid-template-rows:auto 1fr auto;border-left:1px solid #d6ddd8;background:#162327;color:#eef5f2;padding:22px}.time{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #334246;padding-bottom:15px}.time span{color:#9babae}.time strong{font-size:25px}.steps{display:flex;flex-direction:column;justify-content:center;gap:5px;margin:0;padding:12px 0;list-style:none}.steps li{display:grid;grid-template-columns:32px 1fr;align-items:center;min-height:39px;border-radius:7px;padding:5px 7px;color:#7f9195;font-size:12px;font-weight:700}.steps li.now{background:#24383b;color:#fff}.steps li.done{color:#a9b9b9}.steps li span{font-size:11px}.controls{display:grid;grid-template-columns:1fr 46px 46px;gap:8px}.controls button{min-height:46px;border:1px solid #425155;border-radius:9px;background:#223237;color:#fff;font-size:12px;font-weight:800}.controls .primary{border-color:#8ee1d7;background:#a9eee6;color:#0d2728}.progress{max-width:1440px;height:5px;margin:11px auto 0;overflow:hidden;border-radius:999px;background:#d8dedb}.progress span{display:block;height:100%;background:#0d7772;transition:width 80ms linear}@media(max-width:850px){.page{padding:14px}.head{align-items:start;flex-direction:column}.shell{grid-template-columns:1fr;height:auto}.main{min-height:660px}.side{border-top:1px solid #d6ddd8;border-left:0}.steps{display:grid;grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<main class="page">
  <header class="head"><div><p class="brand">VOICEEYE</p><h1>회의가 보이면, 의견을 놓치지 않습니다</h1></div><span class="tag">시연용 대본 · 실제 마이크 성능 측정이 아님</span></header>
  <section class="shell">
    <div class="main">
      <div class="meta"><div><span>회의 안건</span><strong>신규 상담 일정과 안내 방식</strong></div><div><span>현재 단계</span><strong id="stage">준비</strong></div></div>
      <div class="room">
        <div class="seat left" data-seat="left"><i>박</i><div><b>박민준</b><small>상담 담당</small></div></div>
        <div class="seat center" data-seat="center"><i>김</i><div><b>김서연</b><small>진행</small></div></div>
        <div class="seat right" data-seat="right"><i>정</i><div><b>정유진</b><small>운영 지원</small></div></div>
        <div class="caption" id="caption"><div class="ready"><span>80초 회의 시연</span><h2>버튼을 누르면 회의가 자동으로 진행됩니다</h2><p>발언, 동시 발언 확인, 비공개 작성, 음성 전달까지 한 흐름으로 보여 줍니다.</p></div></div>
        <div class="self" data-seat="self"><i>나</i><small>키보드 발언</small></div>
      </div>
      <div class="compose" id="compose"><div><span>내 발언 작성</span><p id="draft">작성 중인 문장은 나만 볼 수 있습니다.</p></div><b id="composeState">비공개</b></div>
    </div>
    <aside class="side"><div class="time"><span>진행 시간</span><strong id="time">0:00</strong></div><ol class="steps" id="steps"></ol><div class="controls"><button class="primary" id="play">회의 시연 시작</button><button id="restart" aria-label="처음부터">↻</button><button id="mute" aria-label="음성 끄기">음성</button></div></aside>
  </section>
  <div class="progress"><span id="bar" style="width:0"></span></div>
</main>
<script>
const DURATION=80000;
const scenario=[
 {startMs:0,label:"회의 시작",title:"상담 일정 조정 회의",lines:[{speaker:"김서연 · 진행",seat:"center",text:"오늘은 장애인 고용 상담에 사용할 보이스아이 시연을 진행하겠습니다."}],note:"참석자에게 자막과 음성 처리 방식을 먼저 알립니다.",voice:"오늘은 장애인 고용 상담에 사용할 보이스아이 시연을 진행하겠습니다."},
 {startMs:9000,label:"안건 확인",title:"다음 상담 일정",lines:[{speaker:"박민준 · 상담 담당",seat:"left",text:"신규 상담 일정은 다음 주 화요일 오전으로 잡겠습니다."}],note:"확정 자막과 발언 방향을 함께 보여 줍니다.",voice:"신규 상담 일정은 다음 주 화요일 오전으로 잡겠습니다."},
 {startMs:19000,label:"동시 발언",title:"두 사람이 겹쳐 말함",warning:true,lines:[{speaker:"박민준 · 상담 담당",seat:"left",text:"장비 설치는 회의 전날 확인하겠습니다."},{speaker:"정유진 · 운영 지원",seat:"right",text:"참여자 안내문은 오늘 먼저 보내겠습니다."}],note:"겹친 문장을 한 줄로 합치지 않고 따로 표시합니다."},
 {startMs:29000,label:"확인 요청",title:"놓친 구간을 바로 확인",warning:true,lines:[{speaker:"VoiceEye",seat:"system",text:"동시 발언이 있었습니다. 두 문장을 나누어 확인해 주세요."}],note:"모르는 문장을 추측해 채우지 않습니다."},
 {startMs:39000,label:"의견 요청",title:"청각장애인 참석자에게 발언 기회 제공",lines:[{speaker:"김서연 · 진행",seat:"center",text:"이종현 님 의견도 듣겠습니다."}],note:"입력 중인 문장은 다른 참석자에게 보이지 않습니다.",draft:"잠시만 기다려 주세요. 제 의견을 입력하고 있습니다.",voice:"이종현 님 의견도 듣겠습니다."},
 {startMs:49000,label:"비공개 확인",title:"보내기 전에 문장을 다시 읽음",lines:[{speaker:"나 · 비공개 미리보기",seat:"self",text:"저는 화요일 오전이 좋습니다. 안내문은 쉬운 문장으로 보내 주세요."}],note:"이 단계에서는 패널과 스피커로 나가지 않습니다.",draft:"저는 화요일 오전이 좋습니다. 안내문은 쉬운 문장으로 보내 주세요."},
 {startMs:60000,label:"음성 발언",title:"확인한 문장만 스피커로 전달",lines:[{speaker:"나 · 스피커 발언",seat:"self",text:"저는 화요일 오전이 좋습니다. 안내문은 쉬운 문장으로 보내 주세요."}],note:"기기에 한국어 음성이 없으면 자막 시연은 그대로 진행됩니다.",voice:"저는 화요일 오전이 좋습니다. 안내문은 쉬운 문장으로 보내 주세요."},
 {startMs:70000,label:"결정 확인",title:"회의 결과를 함께 확인",lines:[{speaker:"김서연 · 진행",seat:"center",text:"화요일 오전으로 정하고, 안내문은 오늘 안에 보내겠습니다."}],note:"시연 종료 · 실제 회의 저장 기능은 본선 개발 범위입니다.",voice:"화요일 오전으로 정하고, 안내문은 오늘 안에 보내겠습니다."}
];
let elapsed=0,running=false,last=0,current=-1,muted=false,timer;
const $=id=>document.getElementById(id);const steps=$("steps");
scenario.forEach((s,i)=>{const li=document.createElement("li");li.innerHTML=`<span>${String(i+1).padStart(2,"0")}</span>${s.label}`;steps.append(li)});
function indexAt(ms){let n=0;scenario.forEach((s,i)=>{if(ms>=s.startMs)n=i});return n}
function lineClass(seat){return seat==="left"?"leftline":seat==="right"?"rightline":seat==="self"?"selfline":seat==="system"?"systemline":""}
function render(){const i=indexAt(elapsed),s=scenario[i];$("stage").textContent=`${i+1} / ${scenario.length}`;$("time").textContent=`0:${String(Math.min(80,Math.floor(elapsed/1000))).padStart(2,"0")}`;$("bar").style.width=`${Math.min(100,elapsed/DURATION*100)}%`;[...steps.children].forEach((li,n)=>li.className=n===i?"now":n<i?"done":"");document.querySelectorAll("[data-seat]").forEach(x=>x.classList.toggle("on",s.lines.some(l=>l.seat===x.dataset.seat)));$("caption").innerHTML=`<div class="caphead"><span>${s.label}</span><em class="status ${s.warning?"warn":""}">${s.warning?"확인 필요":"진행 중"}</em></div><h2>${s.title}</h2><div class="lines">${s.lines.map(l=>`<div class="line ${lineClass(l.seat)}"><span>${l.speaker}</span><p>${l.text}</p></div>`).join("")}</div><p class="note">${s.note}</p>`;$("compose").classList.toggle("on",!!s.draft);$("draft").textContent=s.draft||"작성 중인 문장은 나만 볼 수 있습니다.";$("composeState").textContent=i>=6?"스피커 전달":i===5?"확인 완료":"비공개";if(current!==i){current=i;speak(s.voice,i)}}
function speak(text,i){if(!text||muted||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=i===6?.94:1.04;u.pitch=i%2?0.92:1;speechSynthesis.speak(u)}
function tick(){if(!running)return;const now=performance.now();elapsed=Math.min(DURATION,elapsed+(now-last));last=now;render();if(elapsed>=DURATION){running=false;$("play").textContent="다시 시작";clearInterval(timer)}}
function start(){speechSynthesis&&speechSynthesis.cancel();elapsed=0;current=-1;running=true;last=performance.now();$("play").textContent="잠시 멈춤";clearInterval(timer);render();timer=setInterval(tick,80)}
$("play").onclick=()=>{if(!running&&elapsed>0&&elapsed<DURATION){running=true;last=performance.now();$("play").textContent="잠시 멈춤";timer=setInterval(tick,80);speak(scenario[indexAt(elapsed)].voice,indexAt(elapsed))}else if(running){running=false;clearInterval(timer);speechSynthesis&&speechSynthesis.cancel();$("play").textContent="계속 진행"}else start()};$("restart").onclick=start;$("mute").onclick=()=>{muted=!muted;speechSynthesis&&speechSynthesis.cancel();$("mute").textContent=muted?"무음":"음성"};
</script>
</body>
</html>
